<svg xmlns="http://www.w3.org/2000/svg" width="980" height="940" viewBox="0 0 980 940" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .t   { fill:#0f172a; font-size:13px; }
      .s   { fill:#475569; font-size:11px; }
      .e   { fill:#475569; font-size:11px; }
      .zone{ fill:none; stroke-width:1.5; stroke-dasharray:6 4; rx:14; }
      .node{ stroke-width:1.5; }
      .cli { fill:#eff6ff; stroke:#2563eb; }
      .srv { fill:#ecfeff; stroke:#0891b2; }
      .db  { fill:#f0fdf4; stroke:#16a34a; }
      .ext { fill:#faf5ff; stroke:#9333ea; }
      .warn{ fill:#fef2f2; stroke:#dc2626; }
      path.flow, line.flow { stroke:#475569; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <rect width="980" height="940" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#0f172a">Roo_mue — Architecture &amp; Data Storage</text>
  <text x="32" y="60" class="s">ภาพรวมว่าข้อมูลอยู่ที่ไหน ประมวลผลที่ใด และถูกเก็บอย่างไร</text>

  <!-- ================= BROWSER ZONE ================= -->
  <rect class="zone" x="24" y="80" width="600" height="520" stroke="#2563eb"/>
  <text x="40" y="104" font-size="13" font-weight="700" fill="#2563eb">เบราว์เซอร์ (Client) — ทุกอย่างเกี่ยวกับวิดีโอเกิดที่นี่</text>

  <!-- Camera -->
  <rect class="node cli" x="48" y="124" rx="10" width="170" height="58"/>
  <text class="t" x="133" y="148" text-anchor="middle">กล้อง (getUserMedia)</text>
  <text class="s" x="133" y="166" text-anchor="middle">640×480 MediaStream</text>

  <!-- Frames in memory -->
  <rect class="node warn" x="48" y="214" rx="10" width="170" height="62"/>
  <text class="t" x="133" y="238" text-anchor="middle" font-weight="700">เฟรมวิดีโอ</text>
  <text class="s" x="133" y="256" text-anchor="middle">อยู่ใน RAM ชั่วคราว</text>
  <text class="s" x="133" y="270" text-anchor="middle" fill="#dc2626">ไม่บันทึก / ไม่อัปโหลด</text>

  <!-- Holistic -->
  <rect class="node cli" x="260" y="124" rx="10" width="180" height="58"/>
  <text class="t" x="350" y="148" text-anchor="middle">MediaPipe Holistic</text>
  <text class="s" x="350" y="166" text-anchor="middle">→ landmarks (มือ/หน้า/ตัว)</text>

  <!-- keypoints buffer -->
  <rect class="node cli" x="260" y="214" rx="10" width="180" height="58"/>
  <text class="t" x="350" y="238" text-anchor="middle">seq buffer (keypoints)</text>
  <text class="s" x="350" y="256" text-anchor="middle">rolling array ใน RAM</text>

  <!-- TFJS -->
  <rect class="node cli" x="260" y="304" rx="10" width="180" height="58"/>
  <text class="t" x="350" y="328" text-anchor="middle">TFJS model.predict()</text>
  <text class="s" x="350" y="346" text-anchor="middle">→ top-2 candidates</text>

  <!-- sentence state -->
  <rect class="node cli" x="48" y="304" rx="10" width="170" height="58"/>
  <text class="t" x="133" y="328" text-anchor="middle">ประโยค (React state)</text>
  <text class="s" x="133" y="346" text-anchor="middle">composeSentences()</text>

  <!-- TTS -->
  <rect class="node cli" x="48" y="394" rx="10" width="170" height="56"/>
  <text class="t" x="133" y="418" text-anchor="middle">เสียงพูด (TTS)</text>
  <text class="s" x="133" y="434" text-anchor="middle">Web Speech API</text>

  <!-- model asset -->
  <rect class="node cli" x="260" y="394" rx="10" width="180" height="56"/>
  <text class="t" x="350" y="416" text-anchor="middle">โมเดล TFJS (static)</text>
  <text class="s" x="350" y="432" text-anchor="middle">public/models/thsl</text>

  <text x="48" y="500" class="s" font-weight="700" fill="#2563eb">เก็บฝั่ง client:</text>
  <text x="48" y="520" class="s">• เฟรมวิดีโอ + keypoints = ชั่วคราวใน RAM เท่านั้น</text>
  <text x="48" y="538" class="s">• โมเดลถูกโหลดจากไฟล์ static ใน public/</text>
  <text x="48" y="556" class="s">• เซสชัน login เก็บใน cookie (NextAuth JWT)</text>
  <text x="48" y="574" class="s">• ส่งขึ้น server เฉพาะ "ข้อความประโยคสุดท้าย"</text>

  <!-- ================= EXTERNAL CDN ================= -->
  <rect class="node ext" x="660" y="124" rx="10" width="290" height="58"/>
  <text class="t" x="805" y="148" text-anchor="middle">jsDelivr CDN</text>
  <text class="s" x="805" y="166" text-anchor="middle">ไฟล์ WASM/โมเดลของ MediaPipe Holistic</text>

  <!-- ================= SERVER ZONE ================= -->
  <rect class="zone" x="660" y="220" width="290" height="250" stroke="#0891b2"/>
  <text x="676" y="244" font-size="13" font-weight="700" fill="#0891b2">เซิร์ฟเวอร์ (Next.js)</text>

  <rect class="node srv" x="684" y="262" rx="10" width="242" height="58"/>
  <text class="t" x="805" y="286" text-anchor="middle">Server Action: saveSession()</text>
  <text class="s" x="805" y="304" text-anchor="middle">ตรวจ session แล้วเขียนผ่าน Prisma</text>

  <rect class="node srv" x="684" y="336" rx="10" width="242" height="58"/>
  <text class="t" x="805" y="360" text-anchor="middle">NextAuth (auth)</text>
  <text class="s" x="805" y="378" text-anchor="middle">credentials / Google OAuth</text>

  <rect class="node srv" x="684" y="410" rx="10" width="242" height="46"/>
  <text class="t" x="805" y="438" text-anchor="middle">OTP + rate-limit (สมัคร/รีเซ็ต)</text>

  <!-- ================= DATABASE ZONE ================= -->
  <rect class="zone" x="660" y="500" width="290" height="400" stroke="#16a34a"/>
  <text x="676" y="524" font-size="13" font-weight="700" fill="#16a34a">ฐานข้อมูล (Prisma)</text>
  <text x="676" y="542" class="s">dev = SQLite (prisma/dev.db) · prod = PostgreSQL/Supabase</text>

  <rect class="node db" x="684" y="556" rx="10" width="242" height="72"/>
  <text class="t" x="805" y="578" text-anchor="middle" font-weight="700">TranslationSession</text>
  <text class="s" x="805" y="596" text-anchor="middle">sentence, mode, contextTag,</text>
  <text class="s" x="805" y="612" text-anchor="middle">candidatesJson (JSON string), source</text>

  <rect class="node db" x="684" y="644" rx="10" width="242" height="58"/>
  <text class="t" x="805" y="668" text-anchor="middle" font-weight="700">User</text>
  <text class="s" x="805" y="686" text-anchor="middle">email, passwordHash, โปรไฟล์</text>

  <rect class="node db" x="684" y="718" rx="10" width="242" height="50"/>
  <text class="t" x="805" y="740" text-anchor="middle">Account / Session</text>
  <text class="s" x="805" y="756" text-anchor="middle">โทเคน OAuth / เซสชัน</text>

  <rect class="node db" x="684" y="784" rx="10" width="242" height="46"/>
  <text class="t" x="805" y="812" text-anchor="middle">VerificationToken (OTP)</text>

  <!-- optional supabase -->
  <rect class="node ext" x="684" y="846" rx="10" width="242" height="42"/>
  <text class="t" x="805" y="872" text-anchor="middle">Supabase Storage (ตัวเลือกเสริม)</text>

  <!-- ================= FLOWS ================= -->
  <!-- camera -> frames -->
  <path class="flow" marker-end="url(#arr)" d="M133,182 L133,212"/>
  <!-- frames -> holistic -->
  <path class="flow" marker-end="url(#arr)" d="M218,238 C240,238 240,153 258,153"/>
  <!-- holistic -> buffer -->
  <path class="flow" marker-end="url(#arr)" d="M350,182 L350,212"/>
  <!-- buffer -> tfjs -->
  <path class="flow" marker-end="url(#arr)" d="M350,272 L350,302"/>
  <!-- model asset -> tfjs -->
  <path class="flow" marker-end="url(#arr)" d="M350,392 L350,364"/>
  <!-- tfjs -> sentence -->
  <path class="flow" marker-end="url(#arr)" d="M258,333 C238,333 238,333 220,333"/>
  <!-- sentence -> tts -->
  <path class="flow" marker-end="url(#arr)" d="M133,362 L133,392"/>
  <!-- holistic <-> CDN -->
  <path class="flow" marker-end="url(#arr)" d="M440,150 L658,150"/>
  <text class="e" x="500" y="142">โหลดครั้งแรก</text>

  <!-- sentence -> saveSession (client to server) -->
  <path class="flow" marker-end="url(#arr)" d="M218,318 C470,318 470,291 682,291"/>
  <text class="e" x="430" y="310">ส่งเฉพาะข้อความประโยค</text>

  <!-- saveSession -> DB -->
  <path class="flow" marker-end="url(#arr)" d="M805,320 L805,554"/>
  <text class="e" x="812" y="450">prisma.create()</text>

  <!-- auth -> User -->
  <path class="flow" marker-end="url(#arr)" d="M926,365 C950,365 950,672 928,672" stroke-dasharray="4 3"/>

  <!-- legend -->
  <rect x="24" y="616" width="600" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="640" class="t" font-weight="700">หลักการเก็บข้อมูล (สรุป)</text>
  <text x="40" y="662" class="s">1) วิดีโอ/landmarks ประมวลผลในเบราว์เซอร์ ไม่ถูกบันทึกหรือส่งออก</text>
  <text x="40" y="682" class="s">2) เมื่อกด "บันทึก" client ส่งเฉพาะ "ประโยคที่เลือก" ขึ้น server action</text>
  <text x="40" y="702" class="s">3) saveSession() ตรวจ login แล้วเขียนแถวใน TranslationSession ผ่าน Prisma</text>
  <text x="40" y="722" class="s">4) เก็บจริงที่ SQLite (dev) หรือ PostgreSQL/Supabase (prod) — candidates เก็บเป็น JSON</text>
</svg>
